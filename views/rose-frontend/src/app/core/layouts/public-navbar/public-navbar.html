<header class="public-navbar">
  <a class="brand" routerLink="/">
    <img
      src="/assets/logo.png"
      alt="ROSE logo"
      class="brand-logo"
    />

    <span class="brand-name">ROSE</span>
  </a>

  <nav class="nav-links">
    <a
      routerLink="/"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      Start
    </a>

    <a
      routerLink="/about"
      routerLinkActive="active"
    >
      About
    </a>

    @if (auth.authenticated()) {
      <a
        class="panel-link"
        routerLink="/app/restaurants"
      >
        Przejdź do panelu
      </a>

      <div class="user-summary">
        <div class="user-avatar">
          {{ auth.userInitial() }}
        </div>

        <span>
          @if (auth.currentUser()) {
            Witaj, {{ auth.userFirstName() }}
          } @else {
            Witaj
          }
        </span>
      </div>

      <button
        class="logout-button"
        type="button"
        (click)="logout()"
      >
        Wyloguj
      </button>
    } @else {
      <a
        routerLink="/login"
        routerLinkActive="active"
      >
        Logowanie
      </a>

      <a
        class="register-link"
        routerLink="/register"
      >
        Rejestracja
      </a>
    }
  </nav>
</header>
