<aside class="restaurant-sidebar">
  <a
    class="brand"
    routerLink="/app/restaurants"
  >
    <img
      src="/assets/logo.png"
      alt="ROSE logo"
      class="brand-logo"
    />

    <div class="brand-content">
      <strong>ROSE</strong>
      <span>Panel restauracji</span>
    </div>
  </a>

  <div class="restaurant-summary">
    <div class="restaurant-avatar">
      {{
        restaurantContext
          .restaurantName()
          .charAt(0)
          .toUpperCase()
      }}
    </div>

    <div>
      <span class="restaurant-label">
        Wybrana restauracja
      </span>

      <strong class="restaurant-name">
        {{ restaurantContext.restaurantName() }}
      </strong>
    </div>
  </div>

  <nav class="panel-nav">
    @for (link of links; track link.path) {
      <a
        [routerLink]="buildLink(link.path)"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{
          exact: link.path === ''
        }"
      >
        {{ link.label }}
      </a>
    }
  </nav>

  <a
    class="back-link"
    routerLink="/app/restaurants"
  >
    ← Wróć do restauracji
  </a>
</aside>
