spring.application.name=rose-billing-service

server.port=${SERVER_PORT:8087}

# ============================================================
# IDENTITY SERVICE
# ============================================================

rose.identity.auth-url=${IDENTITY_SERVICE_URL:http://localhost:8081}

# ============================================================
# DATABASE
# ============================================================

spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:rose_billing_service}
spring.datasource.driver-class-name=${DATABASE_DRIVER:org.h2.Driver}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# ============================================================
# H2
# ============================================================

spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

# ============================================================
# LIQUIBASE
# ============================================================

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.yaml

# ============================================================
# RABBITMQ
# ============================================================

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:rose}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:rose}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}

# ============================================================
# ACCESS EVENTS - CONSUMER
# ============================================================

rose.messaging.access.exchange=rose.access.events
rose.messaging.access.member-changed-routing-key=access.restaurant-member-changed.v1
rose.messaging.access.member-changed-queue=rose.billing.access.restaurant-member-changed.v1
rose.messaging.access.member-changed-dead-letter-queue=rose.billing.access.restaurant-member-changed.v1.dlq

# ============================================================
# ORDER EVENTS - CONSUMER
# ============================================================

rose.messaging.order.exchange=rose.order.events
rose.messaging.order.completed-routing-key=order.completed.v1
rose.messaging.order.completed-queue=rose.billing.order.completed.v1
rose.messaging.order.completed-dead-letter-queue=rose.billing.order.completed.v1.dlq

# ============================================================
# OPENAPI
# ============================================================

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ============================================================
# LOGGING
# ============================================================

logging.level.net.rose.rose_billing_service=INFO
logging.level.org.springframework.security=WARN