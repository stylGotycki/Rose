spring.application.name=rose-identity-service

server.port=${SERVER_PORT:8081}

# ============================================================
# DATABASE
# ============================================================

spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:rose_identity_service}
spring.datasource.driver-class-name=${DATABASE_DRIVER:org.h2.Driver}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# ============================================================
# H2 CONSOLE
# ============================================================

spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

# ============================================================
# LIQUIBASE
# ============================================================

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.yaml

# ============================================================
# JWT
# ============================================================

app.security.jwt.secret=${JWT_SECRET:rose-development-jwt-secret-key-that-is-long-enough-2026}

app.security.jwt.access-token-expiration-minutes=${JWT_ACCESS_TOKEN_EXPIRATION_MINUTES:30}
app.security.jwt.refresh-token-expiration-days=${JWT_REFRESH_TOKEN_EXPIRATION_DAYS:30}

# ============================================================
# TOKEN CLEANUP
# ============================================================

app.security.revoked-token-cleanup-cron=${REVOKED_TOKEN_CLEANUP_CRON:0 0 * * * *}

# ============================================================
# RABBITMQ
# ============================================================

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:rose}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:rose}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}

# ============================================================
# ACCESS EVENTS - CONSUMER
# ============================================================

rose.messaging.access.exchange=rose.access.events
rose.messaging.access.access-granted-routing-key=access.restaurant-access-granted.v1
rose.messaging.access.access-granted-queue=rose.identity.restaurant-access-granted.v1
rose.messaging.access.access-granted-dead-letter-queue=rose.identity.restaurant-access-granted.v1.dlq

# ============================================================
# OPENAPI
# ============================================================

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ============================================================
# LOGGING
# ============================================================

logging.level.net.rose.rose_identity_service=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

# ============================================================
# MAIL / MAILHOG
# ============================================================

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

rose.mail.from=${MAIL_FROM:no-reply@rose.local}
rose.mail.verification-base-url=${VERIFICATION_BASE_URL:http://localhost:8080}