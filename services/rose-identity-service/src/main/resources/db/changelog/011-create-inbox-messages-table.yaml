databaseChangeLog:
  - changeSet:
      id: 011-create-inbox-messages-table
      author: Filip Domaszk
      changes:
        - createTable:
            tableName: inbox_messages
            columns:
              - column:
                  name: event_id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_inbox_messages
                    nullable: false

              - column:
                  name: event_type
                  type: VARCHAR(128)
                  constraints:
                    nullable: false

              - column:
                  name: event_version
                  type: INTEGER
                  constraints:
                    nullable: false

              - column:
                  name: producer
                  type: VARCHAR(128)
                  constraints:
                    nullable: false

              - column:
                  name: correlation_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: occurred_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

              - column:
                  name: processed_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

        - createIndex:
            tableName: inbox_messages
            indexName: idx_inbox_messages_event_type
            columns:
              - column:
                  name: event_type

        - createIndex:
            tableName: inbox_messages
            indexName: idx_inbox_messages_processed_at
            columns:
              - column:
                  name: processed_at