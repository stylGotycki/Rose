databaseChangeLog:
  - changeSet:
      id: 005-create-revoked-access-tokens-table
      author: Filip Domaszk
      changes:
        - createTable:
            tableName: revoked_access_tokens
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_revoked_access_tokens
                    nullable: false

              - column:
                  name: token_id
                  type: VARCHAR(64)
                  constraints:
                    nullable: false

              - column:
                  name: revoked_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

              - column:
                  name: expires_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

        - addUniqueConstraint:
            tableName: revoked_access_tokens
            columnNames: token_id
            constraintName: uk_revoked_access_tokens_token_id

        - createIndex:
            tableName: revoked_access_tokens
            indexName: idx_revoked_access_tokens_expires_at
            columns:
              - column:
                  name: expires_at