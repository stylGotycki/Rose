databaseChangeLog:
  - changeSet:
      id: 001-create-users-table
      author: Filip Domaszk
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_users
                    nullable: false

              - column:
                  name: first_name
                  type: VARCHAR(128)
                  constraints:
                    nullable: false

              - column:
                  name: last_name
                  type: VARCHAR(128)
                  constraints:
                    nullable: false

              - column:
                  name: email
                  type: VARCHAR(320)
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(32)
                  constraints:
                    nullable: false

              - column:
                  name: phone_number
                  type: VARCHAR(32)

              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

              - column:
                  name: verified_at
                  type: TIMESTAMP WITH TIME ZONE

              - column:
                  name: disabled_at
                  type: TIMESTAMP WITH TIME ZONE

        - addUniqueConstraint:
            tableName: users
            columnNames: email
            constraintName: uk_users_email

        - createIndex:
            tableName: users
            indexName: idx_users_status
            columns:
              - column:
                  name: status