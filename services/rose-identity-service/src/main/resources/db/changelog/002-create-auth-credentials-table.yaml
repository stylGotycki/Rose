databaseChangeLog:
  - changeSet:
      id: 002-create-auth-credentials-table
      author: Filip Domaszk
      changes:
        - createTable:
            tableName: auth_credentials
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_auth_credentials
                    nullable: false

              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: email
                  type: VARCHAR(320)
                  constraints:
                    nullable: false

              - column:
                  name: password_hash
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

              - column:
                  name: last_login_at
                  type: TIMESTAMP WITH TIME ZONE

        - addUniqueConstraint:
            tableName: auth_credentials
            columnNames: email
            constraintName: uk_auth_credentials_email

        - addUniqueConstraint:
            tableName: auth_credentials
            columnNames: user_id
            constraintName: uk_auth_credentials_user_id

        - addForeignKeyConstraint:
            baseTableName: auth_credentials
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_auth_credentials_user
            onDelete: CASCADE