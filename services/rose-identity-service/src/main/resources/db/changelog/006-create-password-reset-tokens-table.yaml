databaseChangeLog:
  - changeSet:
      id: 006-create-password-reset-tokens-table
      author: Filip Domaszk
      changes:
        - createTable:
            tableName: password_reset_tokens
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_password_reset_tokens
                    nullable: false

              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: token_hash
                  type: VARCHAR(128)
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

              - column:
                  name: expires_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

              - column:
                  name: used_at
                  type: TIMESTAMP WITH TIME ZONE

        - createIndex:
            tableName: password_reset_tokens
            indexName: idx_password_reset_tokens_token_hash
            columns:
              - column:
                  name: token_hash

        - createIndex:
            tableName: password_reset_tokens
            indexName: idx_password_reset_tokens_user_id
            columns:
              - column:
                  name: user_id

        - addForeignKeyConstraint:
            baseTableName: password_reset_tokens
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_password_reset_tokens_user
            onDelete: CASCADE