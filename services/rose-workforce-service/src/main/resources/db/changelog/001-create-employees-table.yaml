databaseChangeLog:
  - changeSet:
      id: 001-create-employees-table
      author: Filip Domaszk
      changes:
        - createTable:
            tableName: employees
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_employees
                    nullable: false

              - column:
                  name: restaurant_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: user_id
                  type: UUID

              - column:
                  name: first_name
                  type: VARCHAR(64)
                  constraints:
                    nullable: false

              - column:
                  name: last_name
                  type: VARCHAR(64)
                  constraints:
                    nullable: false

              - column:
                  name: email
                  type: VARCHAR(128)
                  constraints:
                    nullable: false

              - column:
                  name: phone
                  type: VARCHAR(32)

              - column:
                  name: role
                  type: VARCHAR(32)
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(32)
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE

        - addUniqueConstraint:
            tableName: employees
            columnNames: restaurant_id, email
            constraintName: uq_employee_restaurant_email

        - createIndex:
            tableName: employees
            indexName: idx_employees_restaurant_status
            columns:
              - column:
                  name: restaurant_id
              - column:
                  name: status

        - createIndex:
            tableName: employees
            indexName: idx_employees_user
            columns:
              - column:
                  name: user_id