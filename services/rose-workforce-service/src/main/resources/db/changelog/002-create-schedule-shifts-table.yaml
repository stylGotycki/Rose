databaseChangeLog:
  - changeSet:
      id: 002-create-schedule-shifts-table
      author: Filip Domaszk
      changes:
        - createTable:
            tableName: schedule_shifts
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_schedule_shifts
                    nullable: false

              - column:
                  name: restaurant_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: employee_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: starts_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

              - column:
                  name: ends_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

              - column:
                  name: position
                  type: VARCHAR(32)
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(32)
                  constraints:
                    nullable: false

              - column:
                  name: note
                  type: varchar(1024)

              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE

        - addForeignKeyConstraint:
            baseTableName: schedule_shifts
            baseColumnNames: employee_id
            referencedTableName: employees
            referencedColumnNames: id
            constraintName: fk_schedule_shifts_employee
            onDelete: CASCADE

        - createIndex:
            tableName: schedule_shifts
            indexName: idx_schedule_shifts_restaurant_time
            columns:
              - column:
                  name: restaurant_id
              - column:
                  name: starts_at
              - column:
                  name: ends_at

        - createIndex:
            tableName: schedule_shifts
            indexName: idx_schedule_shifts_employee
            columns:
              - column:
                  name: employee_id