databaseChangeLog:
  - changeSet:
      id: 005-create-outbox-events-table
      author: Filip Domaszk
      changes:
        - createTable:
            tableName: outbox_events
            columns:
              - column:
                  name: event_id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_outbox_events
                    nullable: false

              - column:
                  name: event_type
                  type: VARCHAR(128)
                  constraints:
                    nullable: false

              - column:
                  name: event_version
                  type: INTEGER
                  constraints:
                    nullable: false

              - column:
                  name: exchange_name
                  type: VARCHAR(128)
                  constraints:
                    nullable: false

              - column:
                  name: routing_key
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: payload
                  type: varchar(10000)
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(32)
                  constraints:
                    nullable: false

              - column:
                  name: occurred_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

              - column:
                  name: published_at
                  type: TIMESTAMP WITH TIME ZONE

              - column:
                  name: attempts
                  type: INTEGER
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false

              - column:
                  name: next_attempt_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

              - column:
                  name: last_error
                  type: VARCHAR(2000)

        - createIndex:
            tableName: outbox_events
            indexName: idx_outbox_events_pending
            columns:
              - column:
                  name: status
              - column:
                  name: next_attempt_at