databaseChangeLog:
  - changeSet:
      id: 001-create-orders-table
      author: Filip Domaszk
      changes:
        - createTable:
            tableName: orders
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_orders
                    nullable: false

              - column:
                  name: restaurant_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: created_by_user_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(32)
                  constraints:
                    nullable: false

              - column:
                  name: note
                  type: VARCHAR(512)

              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

        - createIndex:
            tableName: orders
            indexName: idx_orders_restaurant_status
            columns:
              - column:
                  name: restaurant_id
              - column:
                  name: status

        - createIndex:
            tableName: orders
            indexName: idx_orders_created_by_user
            columns:
              - column:
                  name: created_by_user_id