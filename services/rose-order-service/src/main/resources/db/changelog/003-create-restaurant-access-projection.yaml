databaseChangeLog:
  - changeSet:
      id: 003-create-restaurant-access-projection
      author: Filip Domaszk
      changes:
        - createTable:
            tableName: restaurant_access_projection
            columns:
              - column:
                  name: member_id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_restaurant_access_projection
                    nullable: false

              - column:
                  name: restaurant_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: role
                  type: VARCHAR(32)
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(32)
                  constraints:
                    nullable: false

              - column:
                  name: source_changed_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

        - addUniqueConstraint:
            tableName: restaurant_access_projection
            columnNames: restaurant_id, user_id
            constraintName: uk_order_access_restaurant_user

        - createIndex:
            tableName: restaurant_access_projection
            indexName: idx_order_access_restaurant_user
            columns:
              - column:
                  name: restaurant_id
              - column:
                  name: user_id