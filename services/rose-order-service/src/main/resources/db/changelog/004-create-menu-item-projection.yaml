databaseChangeLog:
  - changeSet:
      id: 004-create-menu-item-projection
      author: Filip Domaszk
      changes:
        - createTable:
            tableName: menu_item_projection
            columns:
              - column:
                  name: menu_item_id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_menu_item_projection
                    nullable: false

              - column:
                  name: restaurant_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: price
                  type: DECIMAL(19, 2)
                  constraints:
                    nullable: false

              - column:
                  name: currency
                  type: VARCHAR(16)
                  constraints:
                    nullable: false

              - column:
                  name: orderable
                  type: BOOLEAN
                  constraints:
                    nullable: false

              - column:
                  name: source_changed_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

        - createIndex:
            tableName: menu_item_projection
            indexName: idx_menu_item_projection_restaurant
            columns:
              - column:
                  name: restaurant_id

        - createIndex:
            tableName: menu_item_projection
            indexName: idx_menu_item_projection_restaurant_orderable
            columns:
              - column:
                  name: restaurant_id
              - column:
                  name: orderable