databaseChangeLog:
  - changeSet:
      id: 001-create-restaurant-members-table
      author: Filip Domaszk
      changes:
        - createTable:
            tableName: restaurant_members
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_restaurant_members
                    nullable: false

              - column:
                  name: restaurant_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: role
                  type: VARCHAR(32)
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(32)
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE

        - addUniqueConstraint:
            tableName: restaurant_members
            columnNames: restaurant_id, user_id
            constraintName: uq_restaurant_member_user

        - createIndex:
            tableName: restaurant_members
            indexName: idx_restaurant_members_restaurant_status
            columns:
              - column:
                  name: restaurant_id
              - column:
                  name: status

        - createIndex:
            tableName: restaurant_members
            indexName: idx_restaurant_members_user_status
            columns:
              - column:
                  name: user_id
              - column:
                  name: status