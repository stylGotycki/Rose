spring.application.name=rose-access-service

server.port=${SERVER_PORT:8082}

# ============================================================
# IDENTITY SERVICE
# ============================================================

rose.identity.auth-url=${IDENTITY_SERVICE_URL:http://localhost:8080}

# ============================================================
# DATABASE
# ============================================================

spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:rose_access_service}
spring.datasource.driver-class-name=${DATABASE_DRIVER:org.h2.Driver}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

# ============================================================
# LIQUIBASE
# ============================================================

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.yaml

# ============================================================
# RABBITMQ
# ============================================================

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:rose}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:rose}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}

spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true

# ============================================================
# ORGANIZATION EVENTS - CONSUMER
# ============================================================

rose.messaging.organization.exchange=rose.organization.events
rose.messaging.organization.restaurant-created-routing-key=organization.restaurant-created.v1
rose.messaging.organization.restaurant-created-queue=rose.access.restaurant-created.v1
rose.messaging.organization.restaurant-created-dead-letter-queue=rose.access.restaurant-created.v1.dlq

# ============================================================
# ACCESS EVENTS - PRODUCER
# ============================================================

rose.messaging.access.exchange=rose.access.events
rose.messaging.access.member-changed-routing-key=access.restaurant-member-changed.v1
rose.messaging.access.access-granted-routing-key=access.restaurant-access-granted.v1

# ============================================================
# OUTBOX
# ============================================================

rose.messaging.outbox.fixed-delay-ms=${OUTBOX_FIXED_DELAY_MS:1000}
rose.messaging.outbox.retry-delay-seconds=${OUTBOX_RETRY_DELAY_SECONDS:10}
rose.messaging.outbox.batch-size=${OUTBOX_BATCH_SIZE:50}

# ============================================================
# OPENAPI
# ============================================================

springdoc.swagger-ui.path=/swagger-ui.html

# ============================================================
# LOGGING
# ============================================================

logging.level.net.rose.rose_access_service=INFO
logging.level.org.springframework.amqp.rabbit.core.RabbitAdmin=INFO