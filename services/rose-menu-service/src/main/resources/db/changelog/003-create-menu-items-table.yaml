databaseChangeLog:
  - changeSet:
      id: 003-create-menu-items-table
      author: Filip Domaszk
      changes:
        - createTable:
            tableName: menu_items
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_menu_items
                    nullable: false

              - column:
                  name: category_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: name
                  type: VARCHAR(128)
                  constraints:
                    nullable: false

              - column:
                  name: description
                  type: varchar(1024)

              - column:
                  name: price
                  type: DECIMAL(10, 2)
                  constraints:
                    nullable: false

              - column:
                  name: currency
                  type: VARCHAR(3)
                  constraints:
                    nullable: false

              - column:
                  name: available
                  type: BOOLEAN
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(32)
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE

        - addForeignKeyConstraint:
            baseTableName: menu_items
            baseColumnNames: category_id
            referencedTableName: menu_categories
            referencedColumnNames: id
            constraintName: fk_menu_items_category
            onDelete: CASCADE

        - createIndex:
            tableName: menu_items
            indexName: idx_menu_items_category_status
            columns:
              - column:
                  name: category_id
              - column:
                  name: status