databaseChangeLog:
  - changeSet:
      id: 001-create-menus-table
      author: Filip Domaszk
      changes:
        - createTable:
            tableName: menus
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_menus
                    nullable: false

              - column:
                  name: restaurant_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: name
                  type: VARCHAR(128)
                  constraints:
                    nullable: false

              - column:
                  name: description
                  type: varchar(1024)

              - column:
                  name: status
                  type: VARCHAR(32)
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE

        - addUniqueConstraint:
            tableName: menus
            columnNames: restaurant_id, name
            constraintName: uq_menu_restaurant_name

        - createIndex:
            tableName: menus
            indexName: idx_menus_restaurant_status
            columns:
              - column:
                  name: restaurant_id
              - column:
                  name: status